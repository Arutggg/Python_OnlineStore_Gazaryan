{% extends 'base.html' %}
{% block title %}Вход{% endblock %}
{% block content %}
<h1>Вход</h1>
<form method="post" class="form panel">
  {% csrf_token %}
  {{ form.as_p }}
  <input type="hidden" name="next" value="{{ next }}">
  <button type="submit">Войти</button>
  <p class="muted" style="margin-top:14px">Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
</form>
{% endblock %}

{% extends 'base.html' %}
{% block title %}Регистрация{% endblock %}
{% block content %}
<h1>Регистрация</h1>
<form method="post" class="form panel">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Зарегистрироваться</button>
  <p class="muted" style="margin-top:14px">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
</form>
{% endblock %}
